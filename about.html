<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>About — Olga Prokhorova</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 300;
    }

    body {
      background: #c2c9d3;
      color: #333333;
    }

    /* =========================
       DESKTOP
       ========================= */

    .about-page {
      position: relative;
      width: 100%;
      min-height: 100vh;
      overflow: hidden;
    }

    .about-image {
      display: block;
      width: 100%;
      height: 100vh;
      object-fit: cover;
      object-position: center center;
    }

    .about-content {
      position: absolute;
      left: 4.5%;
      bottom: 12%;
      width: 520px;
      color: #555555;
    }

    .about-name {
      margin: 0 0 24px 0;
      font-size: 42px;
      line-height: 1.05;
      font-weight: 300;
      letter-spacing: 4px;
      color: #efefef;
    }

    .about-text {
      margin: 0;
      max-width: 500px;
      font-size: 16px;
      line-height: 1.45;
      font-weight: 300;
      color: #444444;
    }

    .about-link {
      display: inline-block;
      margin-top: 36px;
      font-size: 16px;
      line-height: 1.2;
      font-weight: 300;
      color: #444444;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .about-link:hover {
      opacity: 0.65;
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 700px) {

      html,
      body {
        background: #c2c9d3;
      }

      .about-page {
        position: relative;
        width: 100%;
        min-height: 100vh;
        overflow: visible;
        background: #c2c9d3;
      }

      /*
        The mobile image is already specially cropped.
        We therefore DO NOT use object-position or zooming.
      */

      .about-image {
        display: block;
        width: 100%;
        height: auto;
        object-fit: contain;
        object-position: center center;
      }

      /*
        Name sits over the top part of the mobile photograph.
      */

      .about-content {
        position: relative;
        left: auto;
        bottom: auto;
        width: 100%;
        padding: 0 9.5% 45px 9.5%;
        color: #333333;
      }

      .about-name {
        position: absolute;
        top: -680px;
        left: 0;
        width: 100%;
        margin: 0;
        padding: 0 20px;

        text-align: center;

        font-size: 32px;
        line-height: 1.1;
        font-weight: 300;
        letter-spacing: 2px;

        color: #efefef;
      }

      .about-text {
        max-width: none;
        margin: 0;
        font-size: 14px;
        line-height: 1.45;
        font-weight: 300;
        color: #333333;
      }

      .about-link {
        display: block;
        width: fit-content;
        margin: 36px auto 0 auto;

        font-size: 12px;
        line-height: 1.2;
        font-weight: 300;

        color: #444444;
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .about-link:hover {
        opacity: 0.65;
      }
    }


    /* =========================
       SMALL PHONES
       ========================= */

    @media (max-width: 390px) {

      .about-name {
        top: -570px;
        font-size: 29px;
        letter-spacing: 2px;
      }

      .about-content {
        padding-left: 9%;
        padding-right: 9%;
        padding-bottom: 40px;
      }

      .about-text {
        font-size: 14px;
        line-height: 1.45;
      }

      .about-link {
        margin-top: 32px;
        font-size: 12px;
      }
    }

  </style>
</head>

<body>

  <main class="about-page">

    <!--
      Desktop:
      banner_web_about.png

      Mobile:
      about_banner_2.png
    -->

    <picture>
      <source
        media="(max-width: 700px)"
        srcset="about_banner_2.png">

      <img
        class="about-image"
        src="banner_web_about.png"
        alt="Olga Prokhorova performance"
      >
    </picture>


    <section class="about-content">

      <h1 class="about-name">
        OLGA PROKHOROVA
      </h1>

      <p class="about-text">
        I make poetic interventions in familiar situations through
        performance, rearranging behaviours and relationships.<br>
        I explore how these encounters can transform our
        understanding of dignity and human experience.
      </p>

      <a class="about-link" href="index.html">
        works and bio
      </a>

    </section>

  </main>

</body>
</html>
