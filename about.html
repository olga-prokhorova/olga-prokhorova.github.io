<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>About — Olga Prokhorova</title>

<link rel="stylesheet" href="style.css">

<style>

/* =========================
   ABOUT PAGE
========================= */

body {
    background: #c2c9d3;
    color: #333;
    overflow-x: hidden;
}

.about-page {
    position: relative;
    width: 100%;
    min-height: 100vh;
    overflow: hidden;
}


/* =========================
   ABOUT IMAGE
========================= */

.about-image {
    display: block;

    width: 100%;
    height: 100vh;

    object-fit: cover;
    object-position: center center;
}


/* =========================
   ABOUT CONTENT
========================= */

.about-content {
    position: absolute;

    left: calc(5.5% + 30px);
    bottom: calc(12% + 100px);

    width: 370px;
    max-width: 370px;

    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 16px;
    font-weight: 300;
    line-height: 1.45;

    color: #444;
}

.about-content p {
    margin: 0;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    body {
        overflow-x: hidden;
        overflow-y: auto;
    }

    .about-page {
        width: 100vw;
        min-height: 100svh;
        overflow: visible;
    }

    .about-image {
        width: 100%;
        height: auto;

        object-fit: contain;

        transform: translateY(-50px);

        margin-bottom: -50px;
    }

    .about-content {
        position: relative;

        left: auto;
        bottom: auto;

        width: 100%;
        max-width: none;

        padding: 0 9.5% 45px;

        transform: translateY(-180px);

        font-size: 14px;
        font-weight: 300;
        line-height: 1.45;

        color: #333;
    }


    /* About page navigation:
       About is intentionally omitted. */

    .site-navigation {
        top: 48%;
        left: auto;
        right: 7%;

        bottom: auto;

        transform: none;

        gap: 22px;
    }
}


/* =========================
   SMALL PHONES
========================= */

@media (max-width: 430px) {

    .site-navigation {
        top: 48%;
        right: 7%;

        gap: 18px;
    }
}

</style>

</head>


<body>

<main class="about-page">


    <!-- ABOUT IMAGE -->

    <picture>

        <source
            media="(max-width: 700px)"
            srcset="about_banner_2.png">

        <img
            class="about-image"
            src="banner_web_about.png"
            alt="Olga Prokhorova">

    </picture>


    <!-- CLICKABLE NAME -->

    <a href="index.html" class="site-name">
        OLGA PROKHOROVA
    </a>


    <!-- ABOUT TEXT -->

    <section class="about-content">

        <p>
            I make poetic interventions in familiar situations through performance, rearranging behaviours and relationships. I explore how these encounters can transform our understanding of dignity and human experience.
        </p>

    </section>


    <!-- NAVIGATION -->

    <nav class="site-navigation">

        <a
            class="instagram"
            href="https://www.instagram.com/performateria/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Instagram"
        >
            <img
                src="instagram_icon.png"
                alt="Instagram"
            >
        </a>

        <a href="work.html">works</a>

        <a href="cv.html">cv</a>

        <a href="bio.html">bio</a>

        <a href="contact.html">contact</a>

    </nav>


</main>

</body>
</html>
