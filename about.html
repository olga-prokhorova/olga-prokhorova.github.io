<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>About — Olga Prokhorova</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #efefef;
        }

        /* FULL SCREEN IMAGE */
        .about-page {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .about-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center center;
        }

        /* TEXT BLOCK */
        .about-content {
            position: absolute;
            left: 4.5vw;
            bottom: 10vh;
            width: 500px;
            color: #515151;
        }

        /* NAME */
        .name {
            margin: 0 0 22px 0;

            font-family: "Europa-Light", "Helvetica Neue", Arial, sans-serif;
            font-size: 38px;
            font-weight: 300;
            letter-spacing: 5px;
            line-height: 1.05;
            white-space: nowrap;

            color: #515151;
        }

        /* DESCRIPTION */
        .description {
            margin: 0;
            max-width: 470px;

            font-family: "Europa-Light", "Helvetica Neue", Arial, sans-serif;
            font-size: 15px;
            font-weight: 300;
            line-height: 1.5;
            letter-spacing: 0.2px;

            color: #515151;
        }

        /* WORKS AND BIO */
        .works-bio {
            display: inline-block;

            margin-top: 34px;
            margin-left: 4px;

            font-family: "Europa-Light", "Helvetica Neue", Arial, sans-serif;
            font-size: 17px;
            font-weight: 300;
            line-height: 1;

            color: #515151;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .works-bio:hover {
            opacity: 0.55;
        }

        /* MOBILE */
        @media (max-width: 700px) {

            .about-image {
                object-position: center center;
            }

            .about-content {
                left: 7vw;
                bottom: 9vh;
                width: 82vw;
            }

            .name {
                font-size: 28px;
                letter-spacing: 4px;
                margin-bottom: 17px;
            }

            .description {
                max-width: 100%;
                font-size: 15px;
                line-height: 1.45;
            }

            .works-bio {
                margin-top: 27px;
                margin-left: 0;
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <main class="about-page">

        <img
            class="about-image"
            src="banner_web_about.png"
            alt="Olga Prokhorova performance in winter"
        >

        <section class="about-content">

            <h1 class="name">
                OLGA PROKHOROVA
            </h1>

            <p class="description">
                I make poetic interventions in familiar situations through
                performance, rearranging behaviours and relationships.
                <br>
                I explore how these encounters can transform our understanding
                of dignity and human experience.
            </p>

            <a class="works-bio" href="index.html">
                works and bio
            </a>

        </section>

    </main>

</body>
</html>
