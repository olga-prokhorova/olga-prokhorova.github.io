<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>About — Olga Prokhrova</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 300;
    }

    body {
      background: #c2c9d3;
      color: #333333;
    }


    /* =========================================
       DESKTOP
       ========================================= */

    .about-page {
      position: relative;
      width: 100%;
      min-height: 100vh;
      overflow: hidden;
    }

    .about-image {
      display: block;
      width: 100%;
      height: 100vh;
      object-fit: cover;
      object-position: center center;
    }


    /* NAME — DESKTOP */

    .about-name {
      position: absolute;
      left: 4.5%;

      /* moved 50px UP */
      bottom: calc(23% + 50px);

      margin: 0;

      font-size: 42px;
      line-height: 1.05;
      font-weight: 300;
      letter-spacing: 4px;

      color: #efefef;

      z-index: 10;
    }


    /* TEXT BLOCK — DESKTOP */

    .about-content {
      position: absolute;
      left: 4.5%;
      bottom: 12%;

      width: 520px;

      color: #555555;

      z-index: 10;
    }

    .about-text {
      margin: 0;
      max-width: 500px;

      font-size: 16px;
      line-height: 1.45;
      font-weight: 300;

      color: #444444;
    }

    .about-link {
      display: inline-block;

      margin-top: 36px;

      font-size: 16px;
      line-height: 1.2;
      font-weight: 300;

      color: #444444;

      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .about-link:hover {
      opacity: 0.65;
    }


    /* =========================================
       MOBILE
       ========================================= */

    @media (max-width: 700px) {

      html,
      body {
        background: #c2c9d3;
      }

      .about-page {
        position: relative;
        width: 100%;
        min-height: 100vh;

        overflow: visible;

        background: #c2c9d3;
      }


      /* MOBILE IMAGE
         DO NOT CHANGE */

      .about-image {
        display: block;

        width: 100%;
        height: auto;

        object-fit: contain;
        object-position: center center;

        transform: translateY(-50px);
        margin-bottom: -50px;
      }


      /* =====================================
         MOBILE NAME
         20px HIGHER
         ===================================== */

      .about-name {
        position: absolute;

        top: 35px;
        left: 0;

        width: 100%;

        margin: 0;
        padding: 0 20px;

        text-align: center;

        font-size: 32px;
        line-height: 1.1;

        font-weight: 300;
        letter-spacing: 2px;

        color: #efefef;

        z-index: 20;
      }


      /* =====================================
         MOBILE TEXT + LINK
         20px LOWER
         ===================================== */

      .about-content {
        position: relative;

        left: auto;
        bottom: auto;

        width: 100%;

        padding: 0 9.5% 45px 9.5%;

        color: #333333;

        /* was -220px, now 20px lower */
        transform: translateY(-200px);
      }


      /* BODY TEXT */

      .about-text {
        max-width: none;

        margin: 0;

        font-size: 14px;
        line-height: 1.45;
        font-weight: 300;

        color: #333333;
      }


      /* LINK */

      .about-link {
        display: block;

        width: fit-content;

        margin: 36px auto 0 auto;

        font-size: 12px;
        line-height: 1.2;
        font-weight: 300;

        color: #444444;

        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .about-link:hover {
        opacity: 0.65;
      }
    }


    /* =========================================
       SMALL PHONES
       ========================================= */

    @media (max-width: 390px) {

      .about-name {
        /* also 20px higher */
        top: 25px;

        font-size: 29px;
        letter-spacing: 2px;
      }

      .about-content {
        padding-left: 9%;
        padding-right: 9%;

        padding-bottom: 40px;

        /* 20px lower */
        transform: translateY(-200px);
      }

      .about-text {
        font-size: 14px;
        line-height: 1.45;
      }

      .about-link {
        margin-top: 32px;

        font-size: 12px;
      }
    }

  </style>
</head>


<body>

  <main class="about-page">

    <picture>

      <!-- MOBILE IMAGE -->
      <source
        media="(max-width: 700px)"
        srcset="about_banner_2.png">

      <!-- DESKTOP IMAGE -->
      <img
        class="about-image"
        src="banner_web_about.png"
        alt="Olga Prokhrova performance">

    </picture>


    <!-- NAME -->

    <h1 class="about-name">
      OLGA PROKHOROVA
    </h1>


    <!-- BODY TEXT + LINK -->

    <section class="about-content">

      <p class="about-text">
        I make poetic interventions in familiar situations through
        performance, rearranging behaviours and relationships.<br>
        I explore how these encounters can transform our
        understanding of dignity and human experience.
      </p>

      <a class="about-link" href="index.html">
        works and bio
      </a>

    </section>

  </main>

</body>
</html>
