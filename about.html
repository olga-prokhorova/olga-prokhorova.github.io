<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>About — Olga Prokhorova</title>

<link rel="stylesheet" href="style.css">

<style>

/* =========================
   ABOUT PAGE
========================= */

body {
    background: #efefef;
    color: #444;
    overflow-x: hidden;
}

.about-page {
    position: relative;
    width: 100%;
    min-height: 100vh;
}


/* =========================
   BACKGROUND IMAGE
========================= */

.about-background {
    display: block;

    width: 100%;
    height: auto;

    object-fit: contain;
}


/* =========================
   ABOUT TEXT — DESKTOP
========================= */

.about-content {
    position: absolute;

    left: calc(5.5% + 30px);
    bottom: calc(12% + 100px);

    width: 400px;
    max-width: 400px;

    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 16px;
    font-weight: 300;
    line-height: 1.45;

    color: #444;
}

.about-content p {
    margin: 0;
}


/* =========================
   ABOUT NAVIGATION
========================= */

.about-page .site-navigation {
    position: fixed;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    body {
        overflow-x: hidden;
        overflow-y: auto;
    }

    .about-page {
        width: 100vw;
        min-height: 100svh;
    }


    /* IMAGE */

    .about-background {
        width: 100%;
        height: auto;

        object-fit: contain;
    }


    /* TEXT
       LEFT EDGE ALIGNED WITH NAME
       INDEPENDENT FROM IMAGE
       BOTTOM ALIGNED WITH CONTACT BUTTON */

    .about-content {
        position: fixed;

        left: 6%;
        bottom: 9%;

        width: 330px;
        max-width: 330px;

        padding: 0;

        transform: none;

        font-size: 14px;
        font-weight: 300;
        line-height: 1.45;

        color: #444;
    }


    /* NAVIGATION
       FIXED ON RIGHT
       SAME MASTER POSITION */

    .about-page .site-navigation {
        position: fixed;

        top: auto;
        left: auto;

        right: 7%;
        bottom: 9%;

        transform: none;

        gap: 22px;
    }

}


/* =========================
   SMALL PHONES
========================= */

@media (max-width: 430px) {

    .about-content {
        left: 6%;
        bottom: 7%;

        width: 275px;
        max-width: 275px;

        font-size: 14px;
    }


    .about-page .site-navigation {
        right: 7%;
        bottom: 7%;

        gap: 18px;
    }

}

</style>

</head>


<body>

<main class="about-page">


    <!-- BACKGROUND IMAGE -->

    <picture>

        <source
            media="(max-width: 700px)"
            srcset="about_banner_2.png">

        <img
            class="about-background"
            src="banner_web_about.png"
            alt="">

    </picture>


    <!-- CLICKABLE NAME -->

    <a
        href="index.html"
        class="site-name">

        OLGA PROKHOROVA

    </a>


    <!-- ABOUT TEXT -->

    <section class="about-content">

        <p>
            I make poetic interventions in familiar situations through performance, rearranging behaviours and relationships. I explore how these encounters can transform our understanding of dignity and human experience.
        </p>

    </section>


    <!-- NAVIGATION -->

    <nav class="site-navigation">

        <a
            class="instagram"
            href="https://www.instagram.com/performateria/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Instagram">

            <img
                src="instagram_icon.png"
                alt="Instagram">

        </a>

        <a href="work.html">works</a>

        <a href="cv.html">cv</a>

        <a href="bio.html">bio</a>

        <a href="contact.html">contact</a>

    </nav>


</main>

</body>
</html>
