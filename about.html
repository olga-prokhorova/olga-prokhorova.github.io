<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>About — Olga Prokhorova</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: 300;
            background: #c2c9d3;
            color: #555555;
        }

        body {
            overflow-x: hidden;
        }

        /* =========================
           DESKTOP
           ========================= */

        .about-page {
            position: relative;
            width: 100vw;
            height: 100vh;
            min-height: 700px;
            overflow: hidden;

            background-image: url("banner_web_about.png");
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
        }

        .about-content {
            position: absolute;

            left: 4.5%;
            bottom: 13%;

            width: 500px;
        }

        .name {
            margin: 0 0 24px 0;

            font-size: 42px;
            line-height: 1.1;
            font-weight: 300;
            letter-spacing: 4px;

            color: #c2c9d3;
        }

        .description {
            margin: 0;

            max-width: 500px;

            font-size: 17px;
            line-height: 1.5;
            font-weight: 300;

            color: #555555;
        }

        .about-link {
            display: inline-block;

            margin-top: 38px;

            font-size: 17px;
            line-height: 1.2;
            font-weight: 300;

            color: #555555;
            text-decoration: underline;
            text-underline-offset: 3px;

            transition: opacity 0.2s ease;
        }

        .about-link:hover {
            opacity: 0.6;
        }


        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 768px) {

            html,
            body {
                background: #c2c9d3;
            }

            .about-page {
                position: relative;

                width: 100%;
                height: auto;
                min-height: 100vh;

                overflow: visible;

                background: #c2c9d3;
            }

            /*
             * Name area
             */

            .about-content {
                position: relative;

                left: auto;
                bottom: auto;

                width: 100%;

                display: flex;
                flex-direction: column;

                padding: 0;
            }

            .name {
                order: 1;

                width: 100%;

                margin: 0;

                padding: 40px 20px 28px 20px;

                text-align: center;

                font-size: 34px;
                line-height: 1.1;
                font-weight: 300;

                letter-spacing: 3px;

                color: #c2c9d3;

                background: #c2c9d3;
            }

            /*
             * Photograph
             */

            .about-page::before {
                content: "";

                display: block;

                width: 100%;
                height: 580px;

                background-image: url("banner_web_about.png");
                background-size: cover;
                background-position: center center;
                background-repeat: no-repeat;
            }

            /*
             * Text area
             */

            .description {
                order: 2;

                width: 100%;

                margin: 0;

                padding: 42px 48px 0 48px;

                max-width: none;

                font-size: 16px;
                line-height: 1.35;
                font-weight: 300;

                color: #333333;

                background: #c2c9d3;
            }

            .about-link {
                order: 3;

                align-self: center;

                margin-top: 48px;
                margin-bottom: 55px;

                font-size: 11px;
                line-height: 1.2;
                font-weight: 300;

                color: #555555;

                text-decoration: underline;
                text-underline-offset: 2px;
            }
        }


        /* =========================
           SMALLER PHONES
           ========================= */

        @media (max-width: 480px) {

            .name {
                padding-top: 38px;
                padding-bottom: 25px;

                font-size: 30px;
                letter-spacing: 3px;
            }

            .about-page::before {
                height: 580px;

                background-position: center center;
            }

            .description {
                padding: 40px 48px 0 48px;

                font-size: 16px;
                line-height: 1.35;
            }

            .about-link {
                margin-top: 48px;
                margin-bottom: 55px;
            }
        }
    </style>
</head>


<body>

    <main class="about-page">

        <section class="about-content">

            <h1 class="name">
                OLGA PROKHOROVA
            </h1>

            <p class="description">
                I make poetic interventions in familiar situations through
                performance, rearranging behaviours and relationships.<br>
                I explore how these encounters can transform our understanding
                of dignity and human experience.
            </p>

            <a class="about-link" href="index.html">
                works and bio
            </a>

        </section>

    </main>

</body>
</html>
