<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>About — Olga Prokhorova</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 300;
    }

    body {
      background: #c2c9d3;
      color: #333333;
    }


    /* =========================================
       ABOUT PAGE
       ========================================= */

    .about-page {
      position: relative;
      width: 100%;
      min-height: 100vh;
      overflow: hidden;
    }

    .about-image {
      display: block;
      width: 100%;
      height: 100vh;
      object-fit: cover;
      object-position: center center;
    }


    /* =========================================
       MASTER NAME
       ========================================= */

    .about-name {
      position: absolute;

      top: calc(11% + 30px);
      left: calc(5.5% + 30px);

      margin: 0;

      color: #efefef;

      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 55px;
      font-weight: 200;
      line-height: 1;
      letter-spacing: 5px;

      white-space: nowrap;

      z-index: 10;
    }


    /* =========================================
       ABOUT TEXT
       ========================================= */

    .about-content {
      position: absolute;
      left: 4.5%;
      bottom: 12%;

      width: 520px;

      color: #555555;

      z-index: 10;
    }

    .about-text {
      margin: 0;
      max-width: 500px;

      font-size: 16px;
      line-height: 1.45;
      font-weight: 300;

      color: #444444;
    }


    /* =========================================
       MASTER NAVIGATION
       ========================================= */

    .navigation {
      position: absolute;

      z-index: 20;

      top: calc(50% + 180px);
      left: 79%;

      transform: translate(-50%, -50%);

      display: flex;
      flex-direction: column;
      align-items: flex-start;

      gap: 34px;
    }


    /* INSTAGRAM */

    .instagram {
      display: block;

      width: 22px;
      height: 22px;

      margin-bottom: 8px;

      opacity: 0.95;

      transition: opacity 0.25s ease;
    }

    .instagram img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: contain;
    }

    .instagram:hover {
      opacity: 0.55;
    }


    /* NAVIGATION LINKS */

    .navigation a:not(.instagram) {
      color: #efefef;

      text-decoration: none;

      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 23px;
      font-weight: 300;
      line-height: 1;

      transition: opacity 0.25s ease;
    }

    .navigation a:not(.instagram):hover {
      opacity: 0.55;
    }


    /* =========================================
       TABLET
       ========================================= */

    @media (max-width: 1100px) {

      .about-name {
        top: calc(10% + 30px);
        left: calc(5% + 30px);

        font-size: 45px;
        font-weight: 200;

        letter-spacing: 4px;
      }

      .navigation {
        top: calc(50% + 150px);
        left: 79%;

        gap: 30px;
      }

      .navigation a:not(.instagram) {
        font-size: 21px;
      }

      .instagram {
        width: 20px;
        height: 20px;
        margin-bottom: 5px;
      }
    }


    /* =========================================
       MOBILE
       ========================================= */

    @media (max-width: 700px) {

      html,
      body {
        background: #c2c9d3;
      }

      .about-page {
        position: relative;
        width: 100%;
        min-height: 100vh;

        overflow: visible;

        background: #c2c9d3;
      }


      /* MOBILE IMAGE — KEEP */

      .about-image {
        display: block;

        width: 100%;
        height: auto;

        object-fit: contain;
        object-position: center center;

        transform: translateY(-50px);
        margin-bottom: -50px;
      }


      /* =====================================
         MASTER MOBILE NAME
         ===================================== */

      .about-name {
        position: absolute;

        top: calc(6% + 70px);
        left: 6%;

        width: auto;

        margin: 0;
        padding: 0;

        text-align: left;

        font-size: 30px;
        line-height: 1.1;

        font-weight: 200;
        letter-spacing: 3px;

        color: #efefef;

        z-index: 20;
      }


      /* =====================================
         MOBILE TEXT
         ===================================== */

      .about-content {
        position: relative;

        left: auto;
        bottom: auto;

        width: 100%;

        padding: 0 9.5% 45px 9.5%;

        color: #333333;

        transform: translateY(-200px);
      }

      .about-text {
        max-width: none;

        margin: 0;

        font-size: 14px;
        line-height: 1.45;
        font-weight: 300;

        color: #333333;
      }

      .about-link {
        display: block;

        width: fit-content;

        margin: 36px auto 0 auto;

        font-size: 12px;
        line-height: 1.2;
        font-weight: 300;

        color: #444444;

        text-decoration: underline;
        text-underline-offset: 3px;
      }


      /* =====================================
         MOBILE NAVIGATION
         ===================================== */

      .navigation {
        top: auto;
        left: auto;

        right: 7%;
        bottom: 9%;

        transform: none;

        gap: 22px;
      }

      .navigation a:not(.instagram) {
        font-size: 19px;
        font-weight: 300;
      }

      .instagram {
        width: 20px;
        height: 20px;

        margin-bottom: 0;
      }

    }


    /* =========================================
       SMALL PHONES
       ========================================= */

    @media (max-width: 430px) {

      .about-name {
        top: calc(6% + 60px);

        font-size: 25px;
        font-weight: 200;

        letter-spacing: 3px;
      }

      .navigation {
        right: 7%;
        bottom: 7%;

        gap: 18px;
      }

      .navigation a:not(.instagram) {
        font-size: 17px;
      }

      .instagram {
        width: 18px;
        height: 18px;
      }

    }

  </style>
</head>


<body>

  <main class="about-page">


    <!-- =================================
         IMAGE
         ================================= -->

    <picture>

      <source
        media="(max-width: 700px)"
        srcset="about_banner_2.png">

      <img
        class="about-image"
        src="banner_web_about.png"
        alt="Olga Prokhorova performance">

    </picture>


    <!-- =================================
         ARTIST NAME
         ================================= -->

    <h1 class="about-name">
      OLGA PROKHOROVA
    </h1>


    <!-- =================================
         ABOUT TEXT
         ================================= -->

    <section class="about-content">

      <p class="about-text">
        I make poetic interventions in familiar situations through
        performance, rearranging behaviours and relationships.<br>
        I explore how these encounters can transform our
        understanding of dignity and human experience.
      </p>

      <a class="about-link" href="index.html">
        works and bio
      </a>

    </section>


    <!-- =================================
         MASTER NAVIGATION
         ================================= -->

    <nav class="navigation">

      <a
        class="instagram"
        href="https://www.instagram.com/performateria/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram"
      >
        <img
          src="instagram_icon.png"
          alt="Instagram"
        >
      </a>

      <a href="work.html">works</a>

      <a href="about.html">about</a>

      <a href="cv.html">cv</a>

      <a href="bio.html">bio</a>

      <a href="contact.html">contact</a>

    </nav>


  </main>

</body>
</html>
