<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>About — Olga Prokhorova</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #efefef;
            color: #515151;
            font-family: Arial, Helvetica, sans-serif;
        }

        .page {
            min-height: 100vh;
            padding: 40px;
        }

        /* NAME */
        .name {
            font-family: "Europa-Light", "Helvetica Neue", Arial, sans-serif;
            font-weight: 300;
            font-size: 55px;
            letter-spacing: 6px;
            color: #515151;
            margin: 0 0 70px 0;
        }

        /* NAVIGATION */
        .nav {
            position: fixed;
            top: 50%;
            right: 55px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 32px;
            z-index: 10;
        }

        .nav a {
            color: #515151;
            text-decoration: none;
            font-family: "Europa-Light", "Helvetica Neue", Arial, sans-serif;
            font-size: 20px;
            font-weight: 300;
        }

        .nav a:hover {
            opacity: 0.55;
        }

        /* ABOUT CONTENT */
        .about {
            max-width: 1450px;
            margin: 0 auto;
        }

        .about-image {
            width: 100%;
            display: block;
        }

        .about-text {
            max-width: 900px;
            margin: 70px 0 120px 0;
            font-size: 25px;
            line-height: 1.45;
            font-weight: 300;
        }

        /* MOBILE */
        @media (max-width: 700px) {

            .page {
                padding: 25px;
            }

            .name {
                font-size: 30px;
                letter-spacing: 4px;
                margin-bottom: 45px;
            }

            .nav {
                position: static;
                transform: none;
                gap: 20px;
                margin-bottom: 45px;
            }

            .nav a {
                font-size: 18px;
            }

            .about-text {
                margin-top: 45px;
                font-size: 20px;
                line-height: 1.5;
            }
        }
    </style>
</head>

<body>

    <div class="page">

        <h1 class="name">OLGA PROKHOROVA</h1>

        <nav class="nav">
            <a href="index.html">works</a>
            <a href="about.html">about</a>
            <a href="#">CV</a>
            <a href="bio.html">bio</a>
            <a href="contact.html">contact</a>
        </nav>

        <main class="about">

            <img
                class="about-image"
                src="banner_web_about.png"
                alt="Olga Prokhorova — performance"
            >

            <div class="about-text">
                I make poetic interventions in familiar situations through
                performance, rearranging behaviours and relationships. I explore
                how these encounters can transform our understanding of dignity
                and human experience.
            </div>

        </main>

    </div>

</body>
</html>
