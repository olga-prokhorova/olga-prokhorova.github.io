<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery</title>

<style>
:root {
    --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
    --light: #efefef;
    --dark: #515151;
    --gap: 14px;
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    background: #000;
    font-family: var(--font);
    font-weight: 300;
    overflow-x: hidden;
}

.gallery-page {
    width: 100%;
    min-height: 100vh;
    background: #000;
    padding: 14px;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: var(--gap);
    width: 100%;
}

.gallery-item {
    display: block;
    width: 100%;
    overflow: hidden;
    background: #000;
}

.gallery-item img {
    display: block;
    width: 100%;
    height: auto;
    object-fit: contain;
    transition: opacity 0.25s ease;
}

.gallery-item:hover img {
    opacity: 0.8;
}


/* =========================
   NAVIGATION
   ========================= */

.navigation {
    position: fixed;
    z-index: 100;
    top: calc(50% + 180px);
    left: 79%;
    transform: translate(-50%, -50%);

    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 34px;

    opacity: 0.5;
}

.navigation a {
    color: var(--light);
    text-decoration: none;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 23px;
    font-weight: 300;
    line-height: 1;
    transition: opacity 0.25s ease;
}

.navigation a:hover {
    opacity: 0.55;
}

.instagram {
    display: block;
    width: 22px;
    height: 22px;
    margin-bottom: 8px;
}

.instagram img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
}


/* =========================
   MOBILE-ONLY ITEMS
   ========================= */

.mobile-only {
    display: none;
}


/* =========================
   BOTTOM SECTION
   ========================= */

.end-block {
    position: relative;
    width: 100%;
    height: 200px;
    margin-top: var(--gap);
    background: #000;
}

.up-button {
    position: absolute;
    left: 50%;
    bottom: 150px;
    transform: translateX(-50%);

    display: block;
    width: fit-content;

    color: #efefef;
    text-decoration: none;
    font: 500 14px/1 var(--font);

    transition: opacity 0.25s ease;
}

.up-button:hover {
    opacity: 0.55;
}


/* =========================
   TABLET
   ========================= */

@media (max-width: 1100px) {

    :root {
        --gap: 12px;
    }

    .gallery-page {
        padding: 12px;
    }

    .navigation {
        top: calc(50% + 150px);
        left: 79%;
        gap: 30px;
    }

    .navigation a {
        font-size: 21px;
    }

    .instagram {
        width: 20px;
        height: 20px;
        margin-bottom: 0;
    }
}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 700px) {

    :root {
        --gap: 10px;
    }

    body {
        overflow-x: hidden;
        overflow-y: auto;
    }

    .gallery-page {
        width: 100vw;
        padding: 0;
    }

    .gallery {
        grid-template-columns: 1fr;
        gap: 0;
    }

    .gallery-item {
        width: 100%;
    }

    .gallery-item img {
        width: 100%;
        height: auto;
    }


    /* Mobile navigation */

    .navigation {
        top: auto;
        left: auto;
        right: 7%;
        bottom: 9%;
        transform: none;

        gap: 22px;
        opacity: 0.5;
    }

    .navigation a {
        font-size: 19px;
    }

    .instagram {
        width: 20px;
        height: 20px;
        margin-bottom: 0;
    }


    /* Show mobile-only items */

    .mobile-only {
        display: block;
    }


    /* Bottom section */

    .end-block {
        height: 200px;
        margin-top: 0;
    }

    .up-button {
        bottom: 150px;
        font-size: 24px;
    }
}


/* =========================
   SMALL MOBILE
   ========================= */

@media (max-width: 430px) {

    .navigation {
        right: 7%;
        bottom: 7%;
        gap: 18px;
        opacity: 0.5;
    }

    .navigation a {
        font-size: 17px;
    }

    .instagram {
        width: 18px;
        height: 18px;
    }

    .up-button {
        bottom: 150px;
        font-size: 24px;
    }
}
</style>
