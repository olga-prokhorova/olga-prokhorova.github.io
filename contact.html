<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact — Olga Prokhorova</title>

<link rel="stylesheet" href="style.css">

<style>

/* =========================
   CONTACT PAGE
========================= */

body {
    background: #000;
    color: #efefef;
    overflow-x: hidden;
}

.contact-page {
    position: relative;
    width: 100%;
    min-height: 100vh;
}


/* =========================
   BACKGROUND IMAGE
========================= */

.contact-background {
    display: block;

    width: 100%;
    height: 100vh;

    object-fit: cover;
}


/* =========================
   CONTACT INSTAGRAM
========================= */

.instagram-link {
    position: absolute;

    top: calc(53% - 10px);
    left: 29%;

    display: block;

    line-height: 0;

    z-index: 10;
}

.instagram-icon {
    display: block;

    width: 82px;
    height: 82px;

    object-fit: contain;
}


/* =========================
   CONTACT NAME
   Uses MASTER typography
========================= */

.contact-name {
    position: absolute;

    top: 68%;
    left: calc(5.5% + 30px);

    z-index: 5;

    margin: 0;

    color: #efefef;
    text-decoration: none;

    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 55px;
    font-weight: 200;
    line-height: 1;
    letter-spacing: 5px;

    white-space: nowrap;
}


/* =========================
   EMAIL
========================= */

.contact-email {
    position: absolute;

    top: 76%;
    left: calc(5.5% + 30px);

    z-index: 5;

    color: #efefef;
    text-decoration: none;

    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 23px;
    font-weight: 300;
    line-height: 1.1;
}

.contact-email:hover {
    opacity: 0.55;
}


/* =========================
   CONTACT NAVIGATION
   MASTER POSITION + STYLE
========================= */

.contact-page .site-navigation {
    position: absolute;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    body {
        overflow-x: hidden;
        overflow-y: auto;
    }

    .contact-page {
        width: 100vw;
        min-height: 100svh;
    }


    /* IMAGE */

    .contact-background {
        width: 100%;
        height: auto;

        object-fit: contain;
    }


    /* INSTAGRAM */

    .instagram-link {
        top: 14%;
        left: 50%;

        transform: translateX(-50%);
    }

    .instagram-icon {
        width: 44px;
        height: 44px;
    }


    /* NAME
       Same master mobile typography */

    .contact-name {
        top: 22%;
        left: 6%;

        transform: none;

        width: auto;

        font-size: 30px;
        font-weight: 200;
        letter-spacing: 3px;
        line-height: 1;

        white-space: nowrap;
    }


    /* EMAIL */

    .contact-email {
        top: 28%;
        left: 6%;

        font-size: 19px;
        font-weight: 300;
        line-height: 1.1;

        white-space: nowrap;
    }


    /* NAVIGATION
       Same master mobile style */

    .contact-page .site-navigation {
        top: auto;
        left: auto;

        right: 7%;
        bottom: 9%;

        transform: none;

        gap: 22px;
    }

    .contact-page .site-navigation a:not(.instagram) {
        font-size: 19px;
        font-weight: 300;
    }

}


/* =========================
   SMALL PHONES
========================= */

@media (max-width: 430px) {

    .contact-name {
        top: 21%;
        left: 6%;

        font-size: 25px;
        font-weight: 200;
        letter-spacing: 3px;
    }

    .contact-email {
        top: 27%;
        left: 6%;

        font-size: 17px;
    }

    .contact-page .site-navigation {
        right: 7%;
        bottom: 7%;

        gap: 18px;
    }

    .contact-page .site-navigation a:not(.instagram) {
        font-size: 17px;
    }

    .instagram-icon {
        width: 40px;
        height: 40px;
    }

}

</style>

</head>


<body>

<main class="contact-page">


    <!-- BACKGROUND IMAGE -->

    <picture>

        <source
            media="(max-width: 700px)"
            srcset="contact_mobile_dark.png">

        <img
            class="contact-background"
            src="contact_desktop_dark.png"
            alt="">

    </picture>


    <!-- CONTACT INSTAGRAM -->

    <a
        class="instagram-link"
        href="https://www.instagram.com/performateria/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram">

        <img
            class="instagram-icon"
            src="instagram_icon.png"
            alt="Instagram">

    </a>


    <!-- CLICKABLE NAME -->

    <a
        href="index.html"
        class="site-name contact-name">

        OLGA PROKHOROVA

    </a>


    <!-- EMAIL -->

    <a
        class="contact-email"
        href="mailto:olga.prokhrova.art@gmail.com">

        olga.prokhrova.art@gmail.com

    </a>


    <!-- NAVIGATION -->

    <nav class="site-navigation">

        <a href="work.html">works</a>

        <a href="about.html">about</a>

        <a href="cv.html">cv</a>

        <a href="bio.html">bio</a>

    </nav>


</main>

</body>
</html>
