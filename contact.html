<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact — Olga Prokhorova</title>

<link rel="stylesheet" href="style.css">

<style>

/* =========================
   CONTACT PAGE
========================= */

body {
    background: #000;
    color: #efefef;
    overflow-x: hidden;
}

.contact-page {
    position: relative;
    width: 100%;
    min-height: 100vh;
}


/* =========================
   BACKGROUND IMAGE
========================= */

.contact-background {
    display: block;

    width: 100%;
    height: 100vh;

    margin: 0;
    padding: 0;

    object-fit: cover;
}


/* =========================
   CONTACT NAME
   SAME POSITION AS HOME
========================= */

.contact-name {
    position: absolute;

    top: calc(11% + 30px);
    left: calc(5.5% + 30px);

    z-index: 5;
}


/* =========================
   EMAIL
========================= */

.contact-email {
    position: absolute;

    top: 76%;
    left: calc(5.5% + 30px);

    z-index: 5;

    color: #efefef;
    text-decoration: none;

    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 23px;
    font-weight: 300;
    line-height: 1.1;
}

.contact-email:hover {
    opacity: 0.55;
}


/* =========================
   CONTACT INFORMATION
========================= */

.contact-info {
    position: absolute;

    top: 81%;
    left: calc(5.5% + 30px);

    z-index: 5;

    width: 400px;
    max-width: 400px;

    color: #d8d8d8;

    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 14px;
    font-weight: 300;
    line-height: 1.5;

    text-align: left;
}

.contact-info p {
    margin: 0;
}


/* =========================
   CONTACT NAVIGATION
   SAME MASTER STYLE
========================= */

.contact-page .site-navigation {
    position: fixed;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    body {
        overflow-x: hidden;
        overflow-y: auto;
    }

    .contact-page {
        width: 100vw;
        min-height: 100svh;
    }


    /* IMAGE */

    .contact-background {
        width: 100%;
        height: auto;

        object-fit: contain;
    }


    /* NAME
       ALIGNED WITH MASTER */

    .contact-name {
        top: calc(6% + 70px);
        left: 6%;

        transform: none;
    }


    /* EMAIL
       SAME LEFT EDGE AS NAME
       MOVED 20PX UP */

    .contact-email {
        top: calc(53% + 104px);
        left: 6%;
        right: auto;

        font-size: 19px;

        text-align: left;
        white-space: nowrap;
    }


    /* CONTACT INFORMATION
       SAME LEFT EDGE AS NAME
       MOVED 20PX UP */

    .contact-info {
        top: calc(57% + 104px);
        left: 6%;
        right: auto;

        width: 330px;
        max-width: 330px;

        font-size: 14px;
        line-height: 1.5;

        text-align: left;
    }


    /* NAVIGATION
       MASTER MOBILE POSITION */

   .contact-page .site-navigation {
    top: auto;
    left: auto;

    right: calc(7% + 20px);
    bottom: 9%;

    transform: none;
}


/* =========================
   SMALL PHONES
========================= */

@media (max-width: 430px) {

    .contact-name {
        top: calc(6% + 60px);
        left: 6%;
    }


    /* EMAIL */

    .contact-email {
        top: calc(53% + 104px);
        left: 6%;

        font-size: 17px;
    }


    /* CONTACT INFORMATION */

    .contact-info {
        top: calc(57% + 104px);
        left: 6%;

        width: 275px;
        max-width: 275px;

        font-size: 13px;
    }


    /* NAVIGATION */

.contact-page .site-navigation {
    right: calc(7% + 20px);
    bottom: 7%;
}

}

</style>

</head>


<body>

<main class="contact-page">


    <!-- BACKGROUND IMAGE -->

    <picture>

        <source
            media="(max-width: 700px)"
            srcset="contact_mobile_dark.png">

        <img
            class="contact-background"
            src="contact_desktop_dark.png"
            alt="">

    </picture>


    <!-- CLICKABLE NAME -->

    <a
        href="index.html"
        class="site-name contact-name">

        OLGA PROKHOROVA

    </a>


    <!-- EMAIL -->

    <a
        class="contact-email"
        href="mailto:olga.prokhrova.art@gmail.com">

        olga.prokhrova.art@gmail.com

    </a>


    <!-- CONTACT INFORMATION -->

    <section class="contact-info">

        <p>
            Oulu, Finland.<br>
            Don't hesitate to contact via social media.
        </p>

    </section>


    <!-- NAVIGATION -->

    <nav class="site-navigation">

        <a
            class="instagram"
            href="https://www.instagram.com/performateria/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Instagram">

            <img
                src="instagram_icon.png"
                alt="Instagram">

        </a>

        <a href="work.html">works</a>

        <a href="about.html">about</a>

        <a href="cv.html">cv</a>

        <a href="bio.html">bio</a>

    </nav>


</main>

</body>
</html>
