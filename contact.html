<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact — Olga Prokhorova</title>

<link rel="stylesheet" href="style.css">

<style>

/* =========================
   CONTACT PAGE
========================= */

body {
    background: #000;
    color: #efefef;
    overflow-x: hidden;
}

.contact-page {
    position: relative;
    width: 100%;
    min-height: 100vh;
}


/* =========================
   BACKGROUND IMAGE
========================= */

.contact-background {
    display: block;

    width: 100%;
    height: 100vh;

    margin: 0;
    padding: 0;

    object-fit: cover;
}


/* =========================
   CONTACT IMAGE INSTAGRAM
========================= */

.instagram-link {
    position: absolute;

    top: calc(53% - 10px);
    left: 29%;

    display: block;

    line-height: 0;

    z-index: 10;
}

.instagram-icon {
    display: block;

    width: 82px;
    height: 82px;

    object-fit: contain;
}


/* =========================
   CONTACT NAME
========================= */

.contact-name {
    position: absolute;

    top: 68%;
    left: calc(5.5% + 30px);

    margin: 0;

    color: #efefef;

    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 55px;
    font-weight: 200;
    line-height: 1;
    letter-spacing: 5px;

    white-space: nowrap;

    z-index: 5;
}


/* =========================
   EMAIL
========================= */

.contact-email {
    position: absolute;

    top: 76%;
    left: calc(5.5% + 30px);

    color: #efefef;

    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: clamp(22px, 2.4vw, 38px);
    font-weight: 200;
    line-height: 1.1;

    text-decoration: none;

    z-index: 5;
}

.contact-email:hover {
    text-decoration: underline;
}


/* =========================
   CONTACT NAVIGATION
   Uses master typography
   and position.
========================= */

.contact-page .site-navigation {
    position: absolute;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .contact-page {
        position: relative;
        width: 100%;
        min-height: 100vh;
    }


    /* MOBILE IMAGE */

    .contact-background {
        display: block;

        width: 100%;
        height: auto;

        margin: 0;
        padding: 0;

        object-fit: contain;
    }


    /* MOBILE INSTAGRAM */

    .instagram-link {
        top: 14%;
        left: 50%;

        transform: translateX(-50%);
    }

    .instagram-icon {
        width: 44px;
        height: 44px;
    }


    /* MOBILE NAME */

    .contact-name {
        top: 22%;
        left: 50%;

        transform: translateX(-50%);

        width: 90%;

        text-align: center;

        font-size: 25px;
        font-weight: 300;
        line-height: 1.1;

        white-space: nowrap;
    }


    /* MOBILE EMAIL */

    .contact-email {
        top: 27%;
        left: 50%;

        transform: translateX(-50%);

        width: 90%;

        text-align: center;

        font-size: 18px;
        font-weight: 300;
        line-height: 1.1;

        white-space: nowrap;
    }


    /* MOBILE NAVIGATION */

    .contact-page .site-navigation {
        top: calc(31% + 40px);
        left: auto;

        right: 24%;
        bottom: auto;

        transform: none;

        gap: 28px;
    }

    .contact-page .site-navigation a:not(.instagram) {
        font-size: 12px;
        font-weight: 300;
    }

}


/* =========================
   SMALL PHONES
========================= */

@media (max-width: 430px) {

    .contact-page .site-navigation {
        right: 24%;
        gap: 18px;
    }

}

</style>

</head>


<body>

<main class="contact-page">


    <!-- IMAGE -->

    <picture>

        <source
            media="(max-width: 700px)"
            srcset="contact_mobile_dark.png">

        <img
            class="contact-background"
            src="contact_desktop_dark.png"
            alt="">

    </picture>


    <!-- CONTACT INSTAGRAM -->

    <a
        class="instagram-link"
        href="https://www.instagram.com/performateria/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram">

        <img
            class="instagram-icon"
            src="instagram_icon.png"
            alt="Instagram">

    </a>


    <!-- CLICKABLE NAME -->

    <a
        href="index.html"
        class="site-name contact-name">

        OLGA PROKHOROVA

    </a>


    <!-- EMAIL -->

    <a
        class="contact-email"
        href="mailto:olga.prokhrova.art@gmail.com">

        olga.prokhrova.art@gmail.com

    </a>


    <!-- NAVIGATION -->

    <nav class="site-navigation">

        <a href="work.html">works</a>

        <a href="about.html">about</a>

        <a href="cv.html">cv</a>

        <a href="bio.html">bio</a>

    </nav>


</main>

</body>
</html>
