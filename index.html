<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Olga Prokhorova</title>

<style>
    * {
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        margin: 0;
        background: #f5f4f1;
        color: #173d3d;
        font-family: Georgia, "Times New Roman", serif;
    }

    /* TOP BAR */
    header {
        height: 105px;
        background: #292929;
        color: #f5f4f1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 45px;
    }

    header h1 {
        margin: 0;
        font-size: 38px;
        letter-spacing: 2px;
        font-weight: normal;
    }

    /* MAIN LAYOUT */
    .page {
        display: grid;
        grid-template-columns: 31% 69%;
        min-height: calc(100vh - 105px);
    }

    /* LEFT MENU */
    .sidebar {
        padding: 42px 45px;
        position: relative;
        min-height: calc(100vh - 105px);
        overflow: hidden;
    }

    .menu {
        display: flex;
        flex-direction: column;
        gap: 48px;
        position: relative;
        z-index: 2;
    }

    .menu a {
        color: #173d3d;
        text-decoration: none;
        font-size: 27px;
    }

    .menu a:hover {
        opacity: 0.55;
    }

    /* PINK FIGURE */
    .pink-figure {
        position: absolute;
        width: 80%;
        max-width: 390px;
        left: 20px;
        bottom: 0;
        z-index: 1;
    }

    /* RIGHT SIDE */
    .content {
        padding: 0 35px 70px 0;
    }

    .hero {
        width: 100%;
        margin: 0;
    }

    .hero img {
        display: block;
        width: 100%;
        height: auto;
    }

    /* ARTIST STATEMENT */
    .statement {
        max-width: 850px;
        margin: 55px auto 0;
        padding: 0 25px;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 22px;
        line-height: 1.55;
        color: #303030;
    }

    /* MOBILE */
    @media (max-width: 800px) {

        header {
            height: 80px;
            padding: 0 20px;
        }

        header h1 {
            font-size: 25px;
            letter-spacing: 1.5px;
        }

        .page {
            display: block;
        }

        .sidebar {
            min-height: auto;
            padding: 25px 25px 15px;
        }

        .menu {
            flex-direction: row;
            flex-wrap: wrap;
            gap: 18px 28px;
        }

        .menu a {
            font-size: 20px;
        }

        .pink-figure {
            display: none;
        }

        .content {
            padding: 0 20px 50px;
        }

        .hero img {
            width: 100%;
        }

        .statement {
            margin-top: 35px;
            padding: 0;
            font-size: 18px;
            line-height: 1.5;
        }
    }
</style>
</head>

<body>

<header>
    <h1>OLGA PROKHOROVA</h1>
</header>

<div class="page">

    <aside class="sidebar">

        <nav class="menu">
            <a href="#works">works</a>
            <a href="#about">about</a>
            <a href="#cv">CV</a>
            <a href="#shop">shop</a>
            <a href="#contact">contact</a>
        </nav>

        <img
            class="pink-figure"
            src="pink_figure_ji.png"
            alt=""
        >

    </aside>

    <main class="content">

        <section id="works" class="hero">
            <img
                src="RESIZED_banner_web_juoppo.png"
                alt="Performance by Olga Prokhorova"
            >
        </section>

        <section id="about" class="statement">
            I make poetic interventions in familiar situations through performance,
            rearranging behaviours and relationships. I explore how these encounters
            can transform our understanding of dignity and human experience.
        </section>

        <section id="cv"></section>
        <section id="shop"></section>
        <section id="contact"></section>

    </main>

</div>

</body>
</html>
