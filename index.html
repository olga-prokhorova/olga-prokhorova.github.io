<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Olga Prokhorova</title>

<style>
    * {
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        margin: 0;
        background: #292929;
        color: #f5f4f1;
        font-family: Georgia, "Times New Roman", serif;
    }

    /* HOMEPAGE */
    .home {
        position: relative;
        width: 100%;
        min-height: 100vh;
        overflow: hidden;
    }

    /* MAIN IMAGE */
    .hero-image {
        position: absolute;
        left: 0;
        top: 0;
        width: calc(100% - 390px);
        height: 100vh;
        object-fit: cover;
        object-position: center center;
    }

    /* NAME */
    .name {
        position: absolute;
        top: 70px;
        left: 75px;
        z-index: 2;
        margin: 0;
        font-size: clamp(34px, 4vw, 62px);
        font-weight: normal;
        letter-spacing: 1px;
        color: #f5f4f1;
    }

    /* NAVIGATION */
    .navigation {
        position: absolute;
        top: 50%;
        right: 0;
        width: 390px;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 43px;
    }

    .navigation a {
        color: #f5f4f1;
        text-decoration: none;
        font-size: 22px;
        transition: opacity 0.2s ease;
    }

    .navigation a:hover {
        opacity: 0.55;
    }

    /* MOBILE */
    @media (max-width: 800px) {

        .home {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .hero-image {
            position: relative;
            width: 100%;
            height: auto;
            min-height: 65vh;
            object-fit: cover;
            object-position: center center;
        }

        .name {
            top: 25px;
            left: 25px;
            font-size: 30px;
        }

        .navigation {
            position: relative;
            top: auto;
            right: auto;
            transform: none;
            width: 100%;
            min-height: 35vh;
            padding: 35px 20px;
            gap: 24px;
            justify-content: center;
        }

        .navigation a {
            font-size: 20px;
        }
    }
</style>
</head>

<body>

<div class="home">

    <img
        class="hero-image"
        src="RESIZED_banner_web_juoppo.png"
        alt="Performance by Olga Prokhorova"
    >

    <h1 class="name">OLGA PROKHOROVA</h1>

    <nav class="navigation">
        <a href="work.html">works</a>
        <a href="about.html">about</a>
        <a href="cv.html">CV</a>
        <a href="bio.html">bio</a>
        <a href="contact.html">contact</a>
    </nav>

</div>

</body>
</html>
