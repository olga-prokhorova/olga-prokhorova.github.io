<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Olga Prokhorova</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

body {
    background: #515151;
    font-family: "Europa-Light", Arial, sans-serif;
}


/* =========================
   FULL SCREEN PHOTOGRAPH
   ========================= */

.home {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

.hero-image {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;
    object-position: center center;

    display: block;
}


/* =========================
   NAME
   ========================= */

.name {
    position: absolute;

    top: 105px;
    left: 80px;

    margin: 0;

    z-index: 10;

    color: #efefef;

    font-family: "Europa-Light", Arial, sans-serif;
    font-size: 65px;
    font-weight: 300;
    line-height: 1;

    white-space: nowrap;
}


/* =========================
   NAVIGATION
   ========================= */

.navigation {
    position: absolute;

    top: 50%;
    right: 70px;

    transform: translateY(-50%);

    z-index: 10;

    display: flex;
    flex-direction: column;

    align-items: flex-start;

    gap: 38px;
}

.navigation a {
    color: #efefef;

    text-decoration: none;

    font-family: "Europa-Light", Arial, sans-serif;
    font-size: 22px;
    font-weight: 300;

    line-height: 1;

    transition: opacity 0.25s ease;
}

.navigation a:hover {
    opacity: 0.55;
}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 800px) {

    .home {
        height: 100svh;
    }

    .hero-image {
        object-fit: cover;
        object-position: center center;
    }

    .name {
        top: 30px;
        left: 25px;
        font-size: 38px;
    }

    .navigation {
        top: auto;
        bottom: 35px;
        right: 25px;

        transform: none;

        gap: 22px;
    }

    .navigation a {
        font-size: 19px;
    }
}


/* =========================
   SMALL PHONES
   ========================= */

@media (max-width: 480px) {

    .name {
        top: 22px;
        left: 20px;
        font-size: 30px;
    }

    .navigation {
        right: 20px;
        bottom: 25px;
        gap: 18px;
    }

    .navigation a {
        font-size: 18px;
    }
}

</style>
</head>


<body>

<div class="home">

    <img
        class="hero-image"
        src="RESIZED_banner_web_juoppo.png"
        alt="Performance by Olga Prokhorova"
    >

    <h1 class="name">
        OLGA PROKHOROVA
    </h1>

    <nav class="navigation">

        <a href="work.html">works</a>

        <a href="about.html">about</a>

        <a href="cv.html">CV</a>

        <a href="bio.html">bio</a>

        <a href="contact.html">contact</a>

    </nav>

</div>

</body>
</html>
