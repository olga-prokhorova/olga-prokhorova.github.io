<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Olga Prokhorova</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    body {
      background: #efefef;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      overflow: hidden;
    }


    /* =================================
       MAIN IMAGE
       ================================= */

    .hero {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .hero-image {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center center;

      display: block;
    }


    /* =================================
       ARTIST NAME
       ================================= */

    .name {
      position: absolute;

      top: calc(11% + 30px);
      left: calc(5.5% + 30px);

      z-index: 2;

      margin: 0;

      color: #efefef;

      font-family:
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;

      font-size: 55px;
      font-weight: 200;

      line-height: 1;
      letter-spacing: 5px;

      white-space: nowrap;
    }


    /* =================================
       NAVIGATION
       ================================= */

    .navigation {
      position: absolute;

      z-index: 3;

      top: calc(50% + 180px);
      left: 79%;

      transform: translate(-50%, -50%);

      display: flex;
      flex-direction: column;
      align-items: flex-start;

      gap: 34px;
    }


    /* INSTAGRAM ICON */

    .instagram {
      display: block;

      width: 22px;
      height: 22px;

      margin-bottom: 8px;

      opacity: 0.95;

      transition: opacity 0.25s ease;
    }

    .instagram img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: contain;
    }

    .instagram:hover {
      opacity: 0.55;
    }


    /* NAVIGATION LINKS */

    .navigation a:not(.instagram) {
      color: #efefef;

      text-decoration: none;

      font-family:
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;

      font-size: 23px;
      font-weight: 300;

      line-height: 1;

      transition: opacity 0.25s ease;
    }

    .navigation a:not(.instagram):hover {
      opacity: 0.55;
    }


    /* =================================
       TABLET
       ================================= */

    @media (max-width: 1100px) {

      .name {
        top: calc(10% + 30px);
        left: calc(5% + 30px);

        font-size: 45px;
        font-weight: 200;

        letter-spacing: 4px;
      }

      .navigation {
        top: calc(50% + 150px);
        left: 79%;

        gap: 30px;
      }

      .navigation a:not(.instagram) {
        font-size: 21px;
      }

      .instagram {
        width: 20px;
        height: 20px;
        margin-bottom: 5px;
      }
    }


    /* =================================
       MOBILE
       ================================= */

    @media (max-width: 700px) {

      body {
        overflow: auto;
      }

      .hero {
        width: 100vw;
        height: 100svh;
        min-height: 600px;
      }

      .hero-image {
        width: 100%;
        height: 100%;

        object-fit: cover;
        object-position: 48% center;
      }

      .name {
  top: calc(6% + 70px);
  left: 6%;

        font-size: 30px;
        font-weight: 200;

        letter-spacing: 3px;
      }


      /* MOBILE NAVIGATION */

      .navigation {
        top: auto;
        left: auto;

        right: 7%;
        bottom: 9%;

        transform: none;

        gap: 22px;
      }

      .navigation a:not(.instagram) {
        font-size: 19px;
        font-weight: 300;
      }

      .instagram {
        width: 20px;
        height: 20px;

        margin-bottom: 0;
      }
    }


    /* =================================
       SMALL MOBILE
       ================================= */

    @media (max-width: 430px) {

      .hero-image {
        object-position: 45% center;
      }

      .name {
  top: calc(6% + 60px);

        font-size: 25px;
        font-weight: 200;

        letter-spacing: 3px;
      }

      .navigation {
        right: 7%;
        bottom: 7%;

        gap: 18px;
      }

      .navigation a:not(.instagram) {
        font-size: 17px;
      }

      .instagram {
        width: 18px;
        height: 18px;
      }
    }

  </style>
</head>


<body>

  <main class="hero">

    <!-- Main photograph -->

    <img
      class="hero-image"
      src="RESIZED_banner_web_juoppo.png"
      alt="Performance by Olga Prokhorova"
    >


    <!-- Artist name -->

    <h1 class="name">
      OLGA PROKHOROVA
    </h1>


    <!-- Navigation -->

    <nav class="navigation">

      <!-- Instagram -->

      <a
        class="instagram"
        href="https://www.instagram.com/performateria/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram"
      >
        <img
          src="instagram_icon.png"
          alt="Instagram"
        >
      </a>


      <a href="work.html">works</a>

      <a href="about.html">about</a>

      <a href="CV.html">CV</a>

      <a href="bio.html">bio</a>

      <a href="contact.html">contact</a>

    </nav>

  </main>

</body>
</html>
