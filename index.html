<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Olga Prokhorova</title>

<link rel="stylesheet" href="style.css">

<style>

/* =========================
   HOME PAGE
========================= */

body {
    background: #efefef;
    overflow: hidden;
}

.hero {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

.hero-image {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;
    object-position: center center;

    display: block;
}


/* =========================
   MOBILE HOME
========================= */

@media (max-width: 700px) {

    body {
        overflow: auto;
    }

    .hero {
        width: 100vw;
        height: 100svh;
        min-height: 600px;
    }

    .hero-image {
        width: 100%;
        height: 100%;

        object-fit: cover;
        object-position: 48% center;
    }
}


@media (max-width: 430px) {

    .hero-image {
        object-position: 45% center;
    }
}

</style>

</head>


<body>

<main class="hero">


    <!-- HOME IMAGE -->

    <img
        class="hero-image"
        src="RESIZED_banner_web_juoppo.jpg"
        alt="Performance by Olga Prokhorova"
    >


    <!-- CLICKABLE NAME -->

    <a href="index.html" class="site-name">
        OLGA PROKHOROVA
    </a>


    <!-- NAVIGATION -->

    <nav class="site-navigation">

        <a
            class="instagram"
            href="https://www.instagram.com/performateria/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Instagram"
        >
            <img
                src="instagram_icon.png"
                alt="Instagram"
            >
        </a>

        <a href="work.html">works</a>

        <a href="about.html">about</a>

        <a href="cv.html">cv</a>

        <a href="bio.html">bio</a>

        <a href="contact.html">contact</a>

    </nav>


</main>

</body>
</html>
